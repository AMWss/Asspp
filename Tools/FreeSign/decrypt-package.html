<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; form-action 'none'; base-uri 'none'"><title>解密 SideStore 安装包</title><style>body{max-width:600px;margin:60px auto;padding:20px;font:17px/1.7 system-ui;color:#263e37;background:#f6f5f0}input,button{display:block;margin:18px 0;padding:12px;max-width:100%;box-sizing:border-box}input[type=password]{width:100%}button{background:#263e37;color:white;border:0;border-radius:10px}#status{white-space:pre-wrap}</style><h1>解密 SideStore 安装包</h1><p>先解压 Actions 下载的 ZIP。在 Chrome 或 Edge 打开本文件，选择 .enc 文件，填写你已有的 SIGNING_STATE_PASSWORD。解密在本机完成，密码和文件不会发送到服务器。</p><label>加密安装包<input id="file" type="file" accept=".enc"></label><label>解密密码<input id="password" type="password" autocomplete="off"></label><button id="decrypt">解密并下载 IPA</button><p id="status" role="status"></p><p>此 IPA 含你的续签凭据，请勿公开分享。装到 iPhone 后仍需配置配对文件、LocalDevVPN，并完成 SideStore 首次刷新。</p><script>
const file=document.getElementById('file'),password=document.getElementById('password'),status=document.getElementById('status'),button=document.getElementById('decrypt');
button.onclick=async()=>{button.disabled=true;try{if(!file.files[0])throw Error('请选择 .enc 文件');if(!crypto.subtle)throw Error('请改用电脑上的 Chrome 或 Edge 打开此文件');status.textContent='正在解密…';const data=new Uint8Array(await file.files[0].arrayBuffer());if(data.length<49||new TextDecoder().decode(data.slice(0,5))!=='ASIP1')throw Error('文件格式不正确');const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:data.slice(5,21),iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const ipa=await crypto.subtle.decrypt({name:'AES-GCM',iv:data.slice(21,33),additionalData:data.slice(0,33),tagLength:128},key,data.slice(33));password.value='';const u=URL.createObjectURL(new Blob([ipa],{type:'application/octet-stream'})),a=document.createElement('a');a.href=u;a.download='SideStore-signed.ipa';a.click();setTimeout(()=>URL.revokeObjectURL(u),60000);status.textContent='解密成功，已下载 SideStore-signed.ipa。';}catch(e){status.textContent=e.name==='OperationError'?'密码不正确，或文件已损坏。':e.message;}finally{button.disabled=false;}};
</script></html>
