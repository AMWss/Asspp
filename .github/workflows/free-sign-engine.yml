name: Free Apple ID signing engine

on:
  workflow_call:
    inputs:
      reset_all_certificates:
        type: boolean
        default: false
      application:
        type: string
        default: Asspp
      operation:
        type: string
        required: true
      build_from_source:
        type: boolean
        default: true
      target_run_id:
        type: string
        default: ""
    secrets:
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      IPHONE_UDID:
        required: false
      SIGNING_STATE_PASSWORD:
        required: false
      APPLE_2FA_CODE:
        required: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  sign:
    if: inputs.operation == 'Sign IPA'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SIGNING_APPLICATION: ${{ inputs.application }}
    concurrency:
      group: free-sign-apple-account
      cancel-in-progress: false
    steps:
      - name: Set temporary paths
        run: |
          {
            echo "SIGNING_STATE_DIR=$RUNNER_TEMP/free-sign-state"
            echo "SIGNING_MAILBOX_DIR=$RUNNER_TEMP/free-sign-mailbox"
            echo "STATE_ARCHIVE=$RUNNER_TEMP/state.enc"
            echo "INPUT_IPA=$RUNNER_TEMP/$SIGNING_APPLICATION-unsigned.ipa"
            echo "SIGNED_IPA=$RUNNER_TEMP/$SIGNING_APPLICATION-signed.ipa"
            echo "PROTECTED_PACKAGE_DIR=$RUNNER_TEMP/protected-package"
            echo "SIGNED_APP_PATH_FILE=$RUNNER_TEMP/signed-app-path.txt"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: self-sign
          persist-credentials: false
      - name: Check selected application
        run: |
          case "$SIGNING_APPLICATION" in
            Asspp|SideStore) ;;
            *) echo "Unsupported application"; exit 1 ;;
          esac
      - name: Check required Secrets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          IPHONE_UDID: ${{ secrets.IPHONE_UDID }}
          SIGNING_STATE_PASSWORD: ${{ secrets.SIGNING_STATE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, re
          for name in ('APPLE_ID', 'APPLE_PASSWORD', 'IPHONE_UDID', 'SIGNING_STATE_PASSWORD'):
              if not os.environ.get(name):
                  raise SystemExit(f'Missing required Secret: {name}')
          if len(os.environ['SIGNING_STATE_PASSWORD']) < 20:
              raise SystemExit('SIGNING_STATE_PASSWORD requires at least 20 characters')
          if not re.fullmatch(r'[0-9A-Fa-f]{8}-[0-9A-Fa-f]{16}|[0-9A-Fa-f]{40}', os.environ['IPHONE_UDID']):
              raise SystemExit('IPHONE_UDID does not look like an Apple device UDID')
          PY
      - name: Prepare Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/free-sign-python"
          "$RUNNER_TEMP/free-sign-python/bin/pip" install 'cryptography==46.0.3'
          echo "$RUNNER_TEMP/free-sign-python/bin" >> "$GITHUB_PATH"
      - name: Compile pinned signer
        working-directory: Tools/FreeSign
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 build --locked --release
      - name: Run offline safety checks
        run: python3 -m unittest discover -s Tools/FreeSign/tests -v
      - name: Checkout application source
        if: inputs.application == 'Asspp' && inputs.build_from_source
        uses: actions/checkout@v4
        with:
          ref: main
          path: app-source
          persist-credentials: false
      - name: Build unsigned IPA from main
        if: inputs.application == 'Asspp' && inputs.build_from_source
        working-directory: app-source
        run: |
          set -euo pipefail
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode*.app' | grep -viE 'beta|_rc' | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          mkdir -p Configuration
          cat > Configuration/Developer.xcconfig <<'EOF'
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          DEVELOPMENT_TEAM =
          EOF
          xcodebuild -workspace Asspp.xcworkspace -scheme Asspp -configuration Release \\
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/AppDerivedData" \\
            -disableAutomaticPackageResolution build CODE_SIGNING_ALLOWED=NO \\
            | tee "$RUNNER_TEMP/app-build.log" | xcbeautify
          mkdir -p "$RUNNER_TEMP/app-package/Payload"
          cp -R "$RUNNER_TEMP/AppDerivedData/Build/Products/Release-iphoneos/Asspp.app" "$RUNNER_TEMP/app-package/Payload/"
          cd "$RUNNER_TEMP/app-package"
          ditto -c -k --keepParent Payload "$INPUT_IPA"
      - name: Restore encrypted signing state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          SIGNING_STATE_PASSWORD: ${{ secrets.SIGNING_STATE_PASSWORD }}
        run: python3 Tools/FreeSign/actions.py restore
      - name: Prepare verification code mailbox
        run: python3 Tools/FreeSign/actions.py init
      - name: Publish public verification request
        uses: actions/upload-artifact@v4
        with:
          name: free-sign-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/free-sign-mailbox/request.json
          retention-days: 1
      - name: Download official upstream IPA
        if: inputs.application == 'SideStore' || !inputs.build_from_source
        run: python3 Tools/FreeSign/actions.py download
      - name: Sign with your Apple ID
        env:
          RESET_ALL_DEVELOPMENT_CERTIFICATES: ${{ inputs.reset_all_certificates }}
          GH_TOKEN: ${{ github.token }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          IPHONE_UDID: ${{ secrets.IPHONE_UDID }}
          SIGNING_STATE_PASSWORD: ${{ secrets.SIGNING_STATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ANISETTE_URL: ${{ vars.ANISETTE_URL || 'https://ani.iloader.app' }}
        run: |
          echo "If Apple asks for a code, set APPLE_2FA_CODE and start another run with operation Send verification code." >> "$GITHUB_STEP_SUMMARY"
          echo "Waiting run ID: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          export SIGNING_HELPER="$GITHUB_WORKSPACE/Tools/FreeSign/actions.py"
          Tools/FreeSign/target/release/asspp-free-sign
      - name: Validate and package signed IPA
        env:
          IPHONE_UDID: ${{ secrets.IPHONE_UDID }}
        run: python3 Tools/FreeSign/actions.py package
      - name: Downloadable signed IPA
        if: inputs.application == 'Asspp'
        uses: actions/upload-artifact@v4
        with:
          name: Asspp-signed
          path: ${{ runner.temp }}/Asspp-signed.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Protect SideStore package containing private signing identity
        if: inputs.application == 'SideStore'
        env:
          SIGNING_STATE_PASSWORD: ${{ secrets.SIGNING_STATE_PASSWORD }}
        run: python3 Tools/FreeSign/actions.py protect-package
      - name: Download encrypted SideStore IPA and local decryptor
        if: inputs.application == 'SideStore'
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-signed-private
          path: ${{ runner.temp }}/protected-package/
          if-no-files-found: error
          retention-days: 3
      - name: Publish signed IPA to Safari installation website
        if: inputs.application == 'Asspp'
        run: python3 Tools/FreeSign/publish.py
      - name: Encrypt updated signing state
        if: always() && steps.state.outcome == 'success'
        env:
          SIGNING_STATE_PASSWORD: ${{ secrets.SIGNING_STATE_PASSWORD }}
        run: python3 Tools/FreeSign/actions.py save
      - name: Persist encrypted state
        if: always() && steps.state.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.state.outputs.state_name }}
          path: ${{ runner.temp }}/state.enc
          if-no-files-found: ignore
          retention-days: 90
      - name: Remove temporary credentials
        if: always()
        run: rm -rf "$SIGNING_STATE_DIR" "$SIGNING_MAILBOX_DIR"

  verification-code:
    if: inputs.operation == 'Send verification code' || inputs.operation == 'Request new code'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set temporary path
        run: echo "CODE_ARCHIVE=$RUNNER_TEMP/code.enc" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: self-sign
          persist-credentials: false
      - name: Prepare Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/free-sign-python"
          "$RUNNER_TEMP/free-sign-python/bin/pip" install 'cryptography==46.0.3'
          echo "$RUNNER_TEMP/free-sign-python/bin" >> "$GITHUB_PATH"
      - name: Encrypt verification code for waiting run
        id: deliver
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_2FA_CODE: ${{ secrets.APPLE_2FA_CODE }}
          TARGET_RUN_ID: ${{ inputs.target_run_id }}
          MESSAGE_KIND: ${{ inputs.operation }}
        run: python3 Tools/FreeSign/actions.py deliver
      - name: Deliver encrypted code
        uses: actions/upload-artifact@v4
        with:
          name: free-sign-code-${{ steps.deliver.outputs.target_run_id }}
          path: ${{ runner.temp }}/code.enc
          if-no-files-found: error
          retention-days: 1
