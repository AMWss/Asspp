name: Sign SideStore Nightly

on:
  workflow_dispatch:
    inputs:
      reset_all_certificates:
        description: Revoke ALL iOS development certificates before signing (affects existing apps)
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [.github/workflows/sidestore-sign.yml]

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  signer:
    if: github.repository == 'AMWss/Asspp'
    uses: AMWss/Asspp/.github/workflows/free-sign-engine.yml@self-sign
    with:
      operation: Sign IPA
      application: SideStore
      reset_all_certificates: ${{ inputs.reset_all_certificates || (github.event_name == 'push' && github.event.head_commit.message == 'Reset developer certificates for authorized SideStore setup 2026-11-07') }}
      build_from_source: false
    secrets:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      IPHONE_UDID: ${{ secrets.IPHONE_UDID }}
      SIGNING_STATE_PASSWORD: ${{ secrets.SIGNING_STATE_PASSWORD }}
      APPLE_2FA_CODE: ${{ secrets.APPLE_2FA_CODE }}
