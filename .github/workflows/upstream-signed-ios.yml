name: iPhone - Upstream Signed OTA

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Rebuild even if this source and compatibility version was already deployed"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: asspp-iphone-ota
  cancel-in-progress: false

jobs:
  detect-upstream:
    if: github.repository != 'Lakr233/Asspp' && (github.event_name == 'workflow_dispatch' || vars.IPHONE_AUTO_BUILD == 'true')
    runs-on: ubuntu-latest
    outputs:
      upstream_sha: ${{ steps.detect.outputs.upstream_sha }}
      short_sha: ${{ steps.detect.outputs.short_sha }}
      tag_name: ${{ steps.detect.outputs.tag_name }}
      should_build: ${{ steps.detect.outputs.should_build }}
    steps:
      - name: Detect source and successful deployment
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force_build || false }}
        run: |
          set -euo pipefail
          # Public Releases are required: iOS cannot authenticate to a private IPA URL.
          test "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)" = public || {
            echo '::error::Use a public fork for this GitHub Releases OTA workflow.'; exit 1;
          }
          SHA=$(git ls-remote https://github.com/Lakr233/Asspp.git refs/heads/main | cut -f1)
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          TAG="iphone-${SHA:0:12}-${GITHUB_SHA:0:12}"
          STATUS=$(curl -sS -o "$RUNNER_TEMP/release.json" -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")
          SHOULD_BUILD=true
          case "$STATUS" in
            200)
              if jq -e '.assets[] | select(.name == "ota-deployed.txt")' "$RUNNER_TEMP/release.json" >/dev/null && [ "$FORCE_BUILD" != true ]; then
                SHOULD_BUILD=false
              fi ;;
            404) ;;
            *) echo "::error::Release lookup failed: HTTP $STATUS"; exit 1 ;;
          esac
          {
            echo "upstream_sha=$SHA"
            echo "short_sha=${SHA:0:12}"
            echo "tag_name=$TAG"
            echo "should_build=$SHOULD_BUILD"
          } >> "$GITHUB_OUTPUT"
          echo "Source: Lakr233/Asspp@$SHA; compatibility: $GITHUB_SHA; build: $SHOULD_BUILD" >> "$GITHUB_STEP_SUMMARY"

  build-release:
    needs: detect-upstream
    if: needs.detect-upstream.outputs.should_build == 'true'
    runs-on: macos-26
    outputs:
      install_url: ${{ steps.pages.outputs.install_url }}
    env:
      UPSTREAM_SHA: ${{ needs.detect-upstream.outputs.upstream_sha }}
      SHORT_SHA: ${{ needs.detect-upstream.outputs.short_sha }}
      TAG_NAME: ${{ needs.detect-upstream.outputs.tag_name }}
    steps:
      - name: Checkout compatibility tools from this fork
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: compatibility
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable upstream source
        uses: actions/checkout@v4
        with:
          repository: Lakr233/Asspp
          ref: ${{ env.UPSTREAM_SHA }}
          path: source
          persist-credentials: false

      - name: Select Xcode
        run: bash compatibility/Resources/Scripts/ios16/select_xcode.sh

      - name: Check packaging helpers
        run: python3 -m unittest discover -s compatibility/Resources/Scripts/ios16/tests -v

      - name: Install signing assets
        id: signing
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          TEAM_ID_OVERRIDE: ${{ secrets.IOS_TEAM_ID }}
          BUNDLE_ID_OVERRIDE: ${{ vars.IOS_BUNDLE_ID }}
          SIGNING_IDENTITY_OVERRIDE: ${{ vars.IOS_SIGNING_IDENTITY }}
          EXPORT_METHOD_OVERRIDE: ${{ vars.IOS_EXPORT_METHOD }}
        run: |
          set -euo pipefail

          if [ -z "${CERT_P12_BASE64}" ] || [ -z "${CERT_PASSWORD}" ] || [ -z "${PROFILE_BASE64}" ]; then
            echo "Missing required secrets: IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64"
            exit 1
          fi

          CERT_PATH="${RUNNER_TEMP}/signing.p12"
          PROFILE_PATH="${RUNNER_TEMP}/profile.mobileprovision"
          PROFILE_PLIST="${RUNNER_TEMP}/profile.plist"
          KEYCHAIN_PATH="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASS="${KEYCHAIN_PASSWORD:-$(uuidgen)}"

          if printf 'dGVzdA==' | base64 --decode >/dev/null 2>&1; then
            printf '%s' "${CERT_P12_BASE64}" | base64 --decode > "${CERT_PATH}"
            printf '%s' "${PROFILE_BASE64}" | base64 --decode > "${PROFILE_PATH}"
          else
            printf '%s' "${CERT_P12_BASE64}" | base64 -D > "${CERT_PATH}"
            printf '%s' "${PROFILE_BASE64}" | base64 -D > "${PROFILE_PATH}"
          fi

          security create-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" -P "${CERT_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple: -k "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"

          EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "${KEYCHAIN_PATH}" ${EXISTING_KEYCHAINS}
          security default-keychain -d user -s "${KEYCHAIN_PATH}"

          security cms -D -i "${PROFILE_PATH}" > "${PROFILE_PLIST}"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "${PROFILE_PLIST}")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "${PROFILE_PLIST}")
          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" "${PROFILE_PLIST}")
          PROFILE_APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" "${PROFILE_PLIST}" 2>/dev/null || true)

          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          cp "${PROFILE_PATH}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          DEFAULT_BUNDLE_ID=$(awk -F '=' '/^PRODUCT_BUNDLE_IDENTIFIER/ { gsub(/[[:space:]]/, "", $2); print $2; exit }' source/Configuration/Base.xcconfig)
          BUNDLE_ID="${BUNDLE_ID_OVERRIDE:-${DEFAULT_BUNDLE_ID}}"
          TEAM_ID="${TEAM_ID_OVERRIDE:-${PROFILE_TEAM_ID}}"
          EXPORT_METHOD="${EXPORT_METHOD_OVERRIDE:-ad-hoc}"

          PROFILE_BUNDLE_ID=""
          if [ -n "${PROFILE_APP_IDENTIFIER}" ]; then
            PROFILE_BUNDLE_ID="${PROFILE_APP_IDENTIFIER#*.}"
          fi

          if [ -n "${PROFILE_BUNDLE_ID}" ]; then
            if [[ "${PROFILE_BUNDLE_ID}" = "*" ]]; then
              true
            elif [[ "${PROFILE_BUNDLE_ID}" = *"*" ]]; then
              PROFILE_PREFIX="${PROFILE_BUNDLE_ID%\*}"
              if [[ "${BUNDLE_ID}" != "${PROFILE_PREFIX}"* ]]; then
                echo "Provisioning profile app identifier does not match bundle id."
                echo "Profile: ${PROFILE_BUNDLE_ID}, Bundle: ${BUNDLE_ID}"
                exit 1
              fi
            elif [ "${PROFILE_BUNDLE_ID}" != "${BUNDLE_ID}" ]; then
              echo "Provisioning profile app identifier does not match bundle id."
              echo "Profile: ${PROFILE_BUNDLE_ID}, Bundle: ${BUNDLE_ID}"
              exit 1
            fi
          fi

          if [ -n "${SIGNING_IDENTITY_OVERRIDE}" ]; then
            SIGNING_IDENTITY="${SIGNING_IDENTITY_OVERRIDE}"
          elif [ "${EXPORT_METHOD}" = "development" ]; then
            SIGNING_IDENTITY="Apple Development"
          else
            SIGNING_IDENTITY="Apple Distribution"
          fi

          if [ "${BUNDLE_ID}" != "${DEFAULT_BUNDLE_ID}" ]; then
            /usr/libexec/PlistBuddy -c "Set :keychain-access-groups:0 \$(AppIdentifierPrefix)${BUNDLE_ID}" source/Asspp/Asspp.entitlements
          fi

          cat > source/Configuration/Developer.xcconfig <<EOF
          // CI-generated Developer.xcconfig
          DEVELOPMENT_TEAM = ${TEAM_ID}
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = ${SIGNING_IDENTITY}
          CODE_SIGN_IDENTITY[sdk=macosx*] = Apple Development
          PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME}
          PROVISIONING_PROFILE = ${PROFILE_UUID}
          PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID}
          EOF

          {
            echo "team_id=${TEAM_ID}"
            echo "bundle_id=${BUNDLE_ID}"
            echo "profile_name=${PROFILE_NAME}"
            echo "export_method=${EXPORT_METHOD}"
            echo "build_number=${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"

      - name: Archive upstream iPhone app
        working-directory: source
        env:
          BUILD_NUMBER: ${{ steps.signing.outputs.build_number }}
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -workspace Asspp.xcworkspace -scheme Asspp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$PWD/build/Asspp.xcarchive" \
            -disableAutomaticPackageResolution \
            clean archive CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee "$RUNNER_TEMP/xcodebuild.log" | xcbeautify
          codesign --verify --deep --strict build/Asspp.xcarchive/Products/Applications/Asspp.app
          python3 ../compatibility/Resources/Scripts/ios16/verify_macho.py build/Asspp.xcarchive/Products/Applications/Asspp.app --variant iphone

      - name: Export signed IPA
        id: export
        working-directory: source
        env:
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
          BUNDLE_ID: ${{ steps.signing.outputs.bundle_id }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          EXPORT_METHOD: ${{ steps.signing.outputs.export_method }}
          SHORT_SHA: ${{ env.SHORT_SHA }}
        run: |
          set -euo pipefail

          cat > "${PWD}/build/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "${PWD}/build/Asspp.xcarchive" \
            -exportPath "${PWD}/build/export" \
            -exportOptionsPlist "${PWD}/build/ExportOptions.plist" | xcbeautify

          IPA_PATH=$(find "${PWD}/build/export" -maxdepth 1 -name "*.ipa" | head -n 1)
          if [ -z "${IPA_PATH}" ]; then
            echo "No IPA produced."
            exit 1
          fi

          NAMED_IPA="${RUNNER_TEMP}/Asspp-iPhone-${SHORT_SHA}.ipa"
          cp "${IPA_PATH}" "${NAMED_IPA}"
          echo "ipa_path=${NAMED_IPA}" >> "$GITHUB_OUTPUT"

      - name: Validate signed IPA
        env:
          IPA_PATH: ${{ steps.export.outputs.ipa_path }}
        run: python3 compatibility/Resources/Scripts/ios16/verify_ipa.py "$IPA_PATH" --signed --variant iphone

      - name: Configure Pages
        id: pages-config
        uses: actions/configure-pages@v5

      - name: Generate OTA page and manifest
        id: pages
        env:
          IPA_PATH: ${{ steps.export.outputs.ipa_path }}
          PAGES_BASE_URL: ${{ vars.IOS_OTA_BASE_URL || steps.pages-config.outputs.base_url }}
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/pages-site"
          BASE="${PAGES_BASE_URL%/}"
          IPA_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/$(basename "$IPA_PATH")"
          for SUBPATH in ios/latest "ios/${TAG_NAME}"; do
            python3 compatibility/Resources/Scripts/ios16/make_ota.py \
              --variant iphone --ipa "$IPA_PATH" --output "$SITE/$SUBPATH" --base-url "$BASE/$SUBPATH" \
              --ipa-url "$IPA_URL" --source "Lakr233/Asspp@$UPSTREAM_SHA; compatibility $GITHUB_SHA"
          done
          cp "$SITE/ios/latest/install.html" "$SITE/index.html"
          touch "$SITE/.nojekyll"
          {
            echo "site_path=$SITE"
            echo "install_url=$BASE/ios/latest/install.html"
          } >> "$GITHUB_OUTPUT"

      - name: Publish signed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IPA_PATH: ${{ steps.export.outputs.ipa_path }}
          INSTALL_URL: ${{ steps.pages.outputs.install_url }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Asspp upstream iPhone build, checked for iOS 18 compatibility.

          - Upstream: https://github.com/Lakr233/Asspp/commit/${UPSTREAM_SHA}
          - Compatibility: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          - iPhone on iOS 18. Device must be covered by the distribution profile.
          - [Install using Safari](${INSTALL_URL}) (available after Pages deployment succeeds)
          - Login and App Store downloads require on-device verification.
          EOF
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
            gh release delete-asset "$TAG_NAME" ota-deployed.txt --repo "$GITHUB_REPOSITORY" --yes || true
          else
            gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Asspp iPhone ($SHORT_SHA)" --notes-file "$RUNNER_TEMP/notes.md" --latest=false
          fi
          gh release upload "$TAG_NAME" "$IPA_PATH" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.pages.outputs.site_path }}

      - name: Keep build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary signing assets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"

  deploy-pages:
    needs: [detect-upstream, build-release]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.detect-upstream.outputs.tag_name }}
          INSTALL_URL: ${{ needs.build-release.outputs.install_url }}
        run: |
          set -euo pipefail
          printf '%s\n' "$INSTALL_URL" > "$RUNNER_TEMP/ota-deployed.txt"
          gh release upload "$TAG_NAME" "$RUNNER_TEMP/ota-deployed.txt" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --latest
          echo "### OTA 已部署" >> "$GITHUB_STEP_SUMMARY"
          echo "[在 iPhone Safari 中打开安装页面]($INSTALL_URL)" >> "$GITHUB_STEP_SUMMARY"
