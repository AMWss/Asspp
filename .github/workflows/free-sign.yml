name: Apple ID Free Sign

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation
        type: choice
        options:
          - Sign IPA
          - Send verification code
          - Request new code
        default: Sign IPA
      build_from_source:
        description: Build current main source before signing (disable to sign upstream release IPA)
        type: boolean
        default: true
      target_run_id:
        description: Waiting run ID (usually leave empty)
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  signer:
    if: github.repository == 'AMWss/Asspp'
    uses: AMWss/Asspp/.github/workflows/free-sign-engine.yml@self-sign
    with:
      operation: ${{ inputs.operation }}
      build_from_source: ${{ inputs.build_from_source }}
      target_run_id: ${{ inputs.target_run_id }}
    secrets:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      IPHONE_UDID: ${{ secrets.IPHONE_UDID }}
      SIGNING_STATE_PASSWORD: ${{ secrets.SIGNING_STATE_PASSWORD }}
      APPLE_2FA_CODE: ${{ secrets.APPLE_2FA_CODE }}
